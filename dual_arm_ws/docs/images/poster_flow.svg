<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 840" width="1600" height="840" font-family="'Microsoft JhengHei','Noto Sans TC','PingFang TC',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#2563EB"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#EA580C"/>
    </marker>
    <style>
      .card{fill:#F8FAFC;stroke:#CBD5E1;stroke-width:2}
      .num{font-size:22px;font-weight:700;fill:#fff}
      .ttl{font-size:24px;font-weight:700;fill:#0F172A}
      .dsc{font-size:17px;fill:#334155}
      .zone{fill:#fff;stroke:#94A3B8;stroke-width:1.5}
      .zl{font-size:15px;font-weight:700;fill:#64748B}
      .cap{fill:#2563EB}
      .occ{stroke:#DC2626;stroke-width:2.2}
      .slot{fill:#fff;stroke:#94A3B8;stroke-width:1.2}
      .base{fill:#CBD5E1}
      .bl{font-size:10px;font-weight:700;fill:#fff}
      .h2{font-size:24px;font-weight:700;fill:#0F172A}
      .chipT{font-size:19px;font-weight:700}
      .chipD{font-size:15px;fill:#334155}
      .li{font-size:18px;fill:#1E293B}
    </style>
  </defs>

  <rect width="1600" height="840" fill="#fff"/>

  <!-- title -->
  <text x="800" y="62" text-anchor="middle" font-size="40" font-weight="700" fill="#0F172A">視覺導引雙臂協同搬運系統</text>
  <text x="800" y="104" text-anchor="middle" font-size="20" fill="#475569">兩支機械手臂以吸盤協作：物件從 A 區取出 → B 區交接 → 放入 C 區八個格位</text>

  <!-- arrows between cards -->
  <g stroke="#475569" stroke-width="3" fill="none" marker-end="url(#ar)">
    <path d="M316 315H344"/><path d="M628 315H656"/><path d="M940 315H968"/><path d="M1252 315H1280"/>
  </g>

  <!-- Card 1: vision -->
  <g transform="translate(40,150)">
    <rect class="card" width="272" height="330" rx="16"/>
    <circle cx="36" cy="36" r="20" fill="#0F766E"/><text class="num" x="36" y="44" text-anchor="middle">1</text>
    <text class="ttl" x="66" y="44">視覺辨識</text>
    <polygon points="136,92 28,176 244,176" fill="#0F766E" opacity="0.08"/>
    <rect x="28" y="112" width="72" height="64" fill="#fff" stroke="#2563EB" stroke-width="2.5"/><rect x="100" y="112" width="72" height="64" fill="#fff" stroke="#16A34A" stroke-width="2.5"/><rect x="172" y="112" width="72" height="64" fill="#fff" stroke="#EAB308" stroke-width="2.5"/>
    <text class="zl" x="64" y="196" text-anchor="middle" style="fill:#2563EB">A</text><text class="zl" x="136" y="196" text-anchor="middle" style="fill:#16A34A">B</text><text class="zl" x="208" y="196" text-anchor="middle" style="fill:#CA8A04">C</text>
    <line x1="136" y1="92" x2="28" y2="176" stroke="#0F766E" stroke-dasharray="4 4"/><line x1="136" y1="92" x2="244" y2="176" stroke="#0F766E" stroke-dasharray="4 4"/>
    <rect x="116" y="66" width="40" height="26" rx="5" fill="#0F766E"/><circle cx="136" cy="79" r="7" fill="#fff"/><circle cx="136" cy="79" r="3.5" fill="#0F766E"/>
    <circle class="cap" cx="50" cy="146" r="7"/><circle class="cap" cx="76" cy="146" r="7"/><circle class="cap" cx="50" cy="164" r="7"/><circle class="cap" cx="76" cy="164" r="7"/>
    <text class="dsc" x="136" y="232" text-anchor="middle">環境相機俯視整個工作區</text>
    <text class="dsc" x="136" y="259" text-anchor="middle">OpenCV 判斷 A、B、C 三區</text>
    <text class="dsc" x="136" y="286" text-anchor="middle">物件的位置與數量</text>
  </g>

  <!-- Card 2: arm1 pick -->
  <g transform="translate(352,150)">
    <rect class="card" width="272" height="330" rx="16"/>
    <circle cx="36" cy="36" r="20" fill="#2563EB"/><text class="num" x="36" y="44" text-anchor="middle">2</text>
    <text class="ttl" x="66" y="44">Arm 1 取件</text>
    <rect x="28" y="112" width="72" height="64" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/><rect x="100" y="112" width="72" height="64" fill="#fff" stroke="#16A34A" stroke-width="2.5"/><rect x="172" y="112" width="72" height="64" fill="#fff" stroke="#EAB308" stroke-width="2.5"/>
    <text class="zl" x="64" y="196" text-anchor="middle" style="fill:#2563EB">A</text><text class="zl" x="136" y="196" text-anchor="middle" style="fill:#16A34A">B</text><text class="zl" x="208" y="196" text-anchor="middle" style="fill:#CA8A04">C</text>
    <circle cx="100" cy="104" r="9" fill="#2563EB"/><text class="bl" x="100" y="108" text-anchor="middle">1</text>
    <circle class="base" cx="172" cy="104" r="9"/><text class="bl" x="172" y="108" text-anchor="middle">2</text>
    <circle class="cap" cx="76" cy="146" r="7"/><circle class="cap" cx="50" cy="164" r="7"/><circle class="cap" cx="76" cy="164" r="7"/>
    <circle cx="50" cy="146" r="7" fill="none" stroke="#2563EB" stroke-dasharray="3 2"/>
    <circle class="cap" cx="136" cy="148" r="7"/>
    <path d="M58 140Q96 116 127 145" stroke="#2563EB" stroke-width="3" fill="none" marker-end="url(#ab)"/>
    <text class="dsc" x="136" y="232" text-anchor="middle">Arm 1 用吸盤吸起</text>
    <text class="dsc" x="136" y="259" text-anchor="middle">A 區的物件</text>
    <text class="dsc" x="136" y="286" text-anchor="middle">放到中間的 B 區</text>
  </g>

  <!-- Card 3: handover -->
  <g transform="translate(664,150)">
    <rect class="card" width="272" height="330" rx="16"/>
    <circle cx="36" cy="36" r="20" fill="#7C3AED"/><text class="num" x="36" y="44" text-anchor="middle">3</text>
    <text class="ttl" x="66" y="44">B 區交接</text>
    <rect x="28" y="112" width="72" height="64" fill="#fff" stroke="#2563EB" stroke-width="2.5"/><rect x="100" y="112" width="72" height="64" fill="#DCFCE7" stroke="#16A34A" stroke-width="2.5"/><rect x="172" y="112" width="72" height="64" fill="#fff" stroke="#EAB308" stroke-width="2.5"/>
    <text class="zl" x="64" y="196" text-anchor="middle" style="fill:#2563EB">A</text><text class="zl" x="136" y="196" text-anchor="middle" style="fill:#16A34A">B</text><text class="zl" x="208" y="196" text-anchor="middle" style="fill:#CA8A04">C</text>
    <circle class="base" cx="100" cy="104" r="9"/><text class="bl" x="100" y="108" text-anchor="middle">1</text>
    <circle class="base" cx="172" cy="104" r="9"/><text class="bl" x="172" y="108" text-anchor="middle">2</text>
    <circle class="cap" cx="136" cy="148" r="7"/>
    <rect x="96" y="62" width="80" height="28" rx="14" fill="#7C3AED"/>
    <text x="136" y="82" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">互鎖</text>
    <text class="dsc" x="136" y="232" text-anchor="middle">B 區同一時間</text>
    <text class="dsc" x="136" y="259" text-anchor="middle">只允許一支手臂進入</text>
    <text class="dsc" x="136" y="286" text-anchor="middle">兩臂不會互相碰撞</text>
  </g>

  <!-- Card 4: arm2 place -->
  <g transform="translate(976,150)">
    <rect class="card" width="272" height="330" rx="16"/>
    <circle cx="36" cy="36" r="20" fill="#EA580C"/><text class="num" x="36" y="44" text-anchor="middle">4</text>
    <text class="ttl" x="66" y="44">Arm 2 放置</text>
    <rect x="28" y="112" width="72" height="64" fill="#fff" stroke="#2563EB" stroke-width="2.5"/><rect x="100" y="112" width="72" height="64" fill="#fff" stroke="#16A34A" stroke-width="2.5"/><rect x="172" y="112" width="72" height="64" fill="#FEF9C3" stroke="#EAB308" stroke-width="2.5"/>
    <text class="zl" x="64" y="196" text-anchor="middle" style="fill:#2563EB">A</text><text class="zl" x="136" y="196" text-anchor="middle" style="fill:#16A34A">B</text><text class="zl" x="208" y="196" text-anchor="middle" style="fill:#CA8A04">C</text>
    <circle class="base" cx="100" cy="104" r="9"/><text class="bl" x="100" y="108" text-anchor="middle">1</text>
    <circle cx="172" cy="104" r="9" fill="#EA580C"/><text class="bl" x="172" y="108" text-anchor="middle">2</text>
    <g class="slot"><rect x="186" y="118" width="20" height="11"/><rect x="214" y="118" width="20" height="11"/><rect x="186" y="132" width="20" height="11"/><rect x="214" y="132" width="20" height="11"/><rect x="186" y="146" width="20" height="11"/><rect x="214" y="146" width="20" height="11"/><rect x="186" y="160" width="20" height="11"/><rect x="214" y="160" width="20" height="11"/></g>
    <rect x="186" y="118" width="20" height="11" fill="#fff" class="occ"/>
    <circle cx="136" cy="148" r="7" fill="none" stroke="#2563EB" stroke-dasharray="3 2"/>
    <circle class="cap" cx="196" cy="123.5" r="5"/>
    <path d="M140 141Q166 112 189 124" stroke="#EA580C" stroke-width="3" fill="none" marker-end="url(#ao)"/>
    <text class="dsc" x="136" y="232" text-anchor="middle">Arm 2 從 B 區吸起物件</text>
    <text class="dsc" x="136" y="259" text-anchor="middle">依序放入 C 區</text>
    <text class="dsc" x="136" y="286" text-anchor="middle">八個格位之一</text>
  </g>

  <!-- Card 5: verify -->
  <g transform="translate(1288,150)">
    <rect class="card" width="272" height="330" rx="16"/>
    <circle cx="36" cy="36" r="20" fill="#16A34A"/><text class="num" x="36" y="44" text-anchor="middle">5</text>
    <text class="ttl" x="66" y="44">確認完成</text>
    <rect x="28" y="112" width="72" height="64" fill="#fff" stroke="#2563EB" stroke-width="2.5"/><rect x="100" y="112" width="72" height="64" fill="#fff" stroke="#16A34A" stroke-width="2.5"/><rect x="172" y="112" width="72" height="64" fill="#FEF9C3" stroke="#EAB308" stroke-width="2.5"/>
    <text class="zl" x="64" y="196" text-anchor="middle" style="fill:#2563EB">A</text><text class="zl" x="136" y="196" text-anchor="middle" style="fill:#16A34A">B</text><text class="zl" x="208" y="196" text-anchor="middle" style="fill:#CA8A04">C</text>
    <circle class="base" cx="100" cy="104" r="9"/><text class="bl" x="100" y="108" text-anchor="middle">1</text>
    <circle class="base" cx="172" cy="104" r="9"/><text class="bl" x="172" y="108" text-anchor="middle">2</text>
    <g class="slot"><rect class="occ" x="186" y="118" width="20" height="11"/><rect class="occ" x="214" y="118" width="20" height="11"/><rect class="occ" x="186" y="132" width="20" height="11"/><rect class="occ" x="214" y="132" width="20" height="11"/><rect class="occ" x="186" y="146" width="20" height="11"/><rect class="occ" x="214" y="146" width="20" height="11"/><rect class="occ" x="186" y="160" width="20" height="11"/><rect class="occ" x="214" y="160" width="20" height="11"/></g>
    <g class="cap"><circle cx="196" cy="123.5" r="5"/><circle cx="224" cy="123.5" r="5"/><circle cx="196" cy="137.5" r="5"/><circle cx="224" cy="137.5" r="5"/><circle cx="196" cy="151.5" r="5"/><circle cx="224" cy="151.5" r="5"/><circle cx="196" cy="165.5" r="5"/><circle cx="224" cy="165.5" r="5"/></g>
    <circle cx="136" cy="78" r="17" fill="#16A34A"/><path d="M127 78l6 6 11-12" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="dsc" x="136" y="232" text-anchor="middle">確認物件已放進格位</text>
    <text class="dsc" x="136" y="259" text-anchor="middle">兩臂回到 HOME 姿態</text>
    <text class="dsc" x="136" y="286" text-anchor="middle">八格放滿即完成任務</text>
  </g>

  <!-- loop back -->
  <path d="M1424 480V516H176V490" stroke="#475569" stroke-width="3" fill="none" stroke-dasharray="8 6" marker-end="url(#ar)"/>
  <rect x="680" y="502" width="240" height="30" rx="15" fill="#fff"/>
  <text x="800" y="524" text-anchor="middle" font-size="18" font-weight="700" fill="#475569">還有物件 → 進行下一輪</text>

  <!-- architecture -->
  <rect x="40" y="566" width="1520" height="244" rx="16" fill="#fff" stroke="#CBD5E1" stroke-width="2"/>
  <text class="h2" x="64" y="606">系統架構</text>
  <g stroke="#475569" stroke-width="3" fill="none" marker-end="url(#ar)">
    <path d="M394 690H440"/><path d="M778 690H824"/><path d="M1162 690H1208"/>
  </g>
  <g>
    <rect x="64" y="630" width="320" height="120" rx="12" fill="#CCFBF1"/>
    <text class="chipT" x="224" y="664" text-anchor="middle" fill="#0F766E">感知</text>
    <text class="chipD" x="224" y="694" text-anchor="middle">環境相機＋兩支手臂相機</text>
    <text class="chipD" x="224" y="718" text-anchor="middle">OpenCV 影像辨識</text>
  </g>
  <g>
    <rect x="448" y="630" width="320" height="120" rx="12" fill="#EDE9FE"/>
    <text class="chipT" x="608" y="664" text-anchor="middle" fill="#6D28D9">決策</text>
    <text class="chipD" x="608" y="694" text-anchor="middle">任務協調節點</text>
    <text class="chipD" x="608" y="718" text-anchor="middle">分配步驟、管理 B 區</text>
  </g>
  <g>
    <rect x="832" y="630" width="320" height="120" rx="12" fill="#DBEAFE"/>
    <text class="chipT" x="992" y="664" text-anchor="middle" fill="#1D4ED8">規劃</text>
    <text class="chipD" x="992" y="694" text-anchor="middle">MoveIt 2 雙臂路徑規劃</text>
    <text class="chipD" x="992" y="718" text-anchor="middle">避開另一支手臂</text>
  </g>
  <g>
    <rect x="1216" y="630" width="320" height="120" rx="12" fill="#FFEDD5"/>
    <text class="chipT" x="1376" y="664" text-anchor="middle" fill="#C2410C">執行</text>
    <text class="chipD" x="1376" y="694" text-anchor="middle">CM-530 控制 8 顆 AX-12A</text>
    <text class="chipD" x="1376" y="718" text-anchor="middle">ESP32 控制吸盤</text>
  </g>
  <text x="800" y="788" text-anchor="middle" font-size="16" fill="#64748B">ROS 2 Jazzy 整合 · Gazebo Harmonic 模擬驗證 · Jetson AGX Orin 部署</text>
</svg>
